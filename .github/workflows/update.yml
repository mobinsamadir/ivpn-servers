name: Auto Update Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Collector
      run: |
        python collector.py

    - name: List files (Debug)
      run: ls -R

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        # اضافه کردن همه فایل‌های جدید (شامل live_servers.txt)
        git add .
        # کامیت کردن حتی اگر فایل جدید باشد
        git commit -m "🔄 Update servers list" || echo "No changes to commit"
        git push
