name: Auto Update Configs

on:
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Cache Xray Binary
      uses: actions/cache@v3
      with:
        path: bin/
        key: xray-Linux-v24.11.21

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Aggregator
      run: |
        python aggregator.py

    - name: Optimize Network Stack
      run: |
        sudo sysctl -w net.ipv4.tcp_tw_reuse=1
        sudo sysctl -w net.ipv4.tcp_fin_timeout=15

    - name: Run Tester
      run: |
        python tester.py
      env:
        TCP_CONCURRENCY: 1500
        REAL_DELAY_BATCH_SIZE: 250
        REAL_DELAY_INSTANCES: 8
        TCP_TIMEOUT: 1.5
        REAL_DELAY_TIMEOUT: 3.0

    - name: Run Local Auditor (Phase 0/1 & Persistence)
      run: |
        # Run local_test.py to apply whitelist priority and update cache
        python local_test.py
      env:
        TCP_TIMEOUT: 1.5
        REAL_DELAY_TIMEOUT: 3.0
        # Emulate high concurrency for actions even in local_test.py
        GITHUB_ACTIONS: 'true'

    - name: Debug File List
      run: ls -lh

    - name: Prune Empty Artifacts
      if: always()
      run: |
        if [ ! -s debug_poison_configs.txt ]; then
          rm -f debug_poison_configs.txt
        fi

    - name: Upload Debug Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: debug_poison_configs.txt
        if-no-files-found: ignore

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # Add core result files
        git add all_configs.txt tcp_passed.txt real_delay_passed.txt sources.txt
        
        # Add Persistence Layer
        git add data/local_cache.json

        # Add Golden List
        if [ -d "tested_configs" ]; then
            git add tested_configs/*.txt
        fi

        if output=$(git status --porcelain) && [ -z "$output" ]; then
          echo "⚠️ No changes detected to commit."
        else
          git commit -m "🔄 Update server list & cache [$(date)]"
          git push
        fi
