name: Auto Update Configs

on:
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Cache Xray Binary & GeoIP Database
      uses: actions/cache@v4
      with:
        path: bin/
        key: xray-tools-v2-${{ runner.os }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Aggregator
      run: |
        python aggregator.py

    - name: Optimize Network Stack
      run: |
        sudo sysctl -w net.ipv4.tcp_tw_reuse=1
        sudo sysctl -w net.ipv4.tcp_fin_timeout=15

    - name: Run Tester (Initial Mass Audit)
      run: |
        python tester.py
      env:
        TCP_CONCURRENCY: 1500
        REAL_DELAY_BATCH_SIZE: 250
        REAL_DELAY_INSTANCES: 8
        TCP_TIMEOUT: 1.5
        REAL_DELAY_TIMEOUT: 3.0

    - name: Run Local Auditor (Whitelist Priority & Cache Persistence)
      run: |
        python local_test.py
      env:
        INPUT_FILE: 'real_delay_passed.txt'
        TCP_TIMEOUT: 1.5
        REAL_DELAY_TIMEOUT: 3.0
        GITHUB_ACTIONS: 'true'

    - name: Debug File List
      run: ls -lh

    - name: Prune Empty Artifacts
      if: always()
      run: |
        if [ ! -s debug_poison_configs.txt ]; then
          rm -f debug_poison_configs.txt
        fi

    - name: Upload Debug Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: debug_poison_configs.txt
        if-no-files-found: ignore

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # Add core result files (excluding large temporary files)
        git add real_delay_passed.txt servers.json sources.txt README.md .gitignore
        
        # Add Persistence Layer
        git add data/local_cache.json
        
        # Add Golden List
        if [ -d "tested_configs" ]; then
            git add tested_configs/*.txt
        fi

        # Add Iran VPS Results if present
        if [ -f "servers_iran.json" ]; then
            git add servers_iran.json
        fi

        # Discard any remaining unstaged temporary files to keep tree clean
        git checkout -- . 2>/dev/null || true

        if output=$(git status --porcelain) && [ -z "$output" ]; then
          echo "⚠️ No changes detected to commit."
        else
          git commit -m "🔄 Update server list & cache [$(date)]"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin main && break || {
              echo "⚠️ Push/rebase failed, retrying in 3s..."
              sleep 3
            }
          done
        fi
